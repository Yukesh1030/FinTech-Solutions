<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your STACKLY FinTech account. Access Admin and Client dashboards.">
  <title>Login | STACKLY FinTech Solutions</title>
  
  <link rel="icon" type="image/webp" href="Assets/Brand-logo.webp">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Diagonal split background per screenshot */
    .auth-page-bg {
      background: linear-gradient(115deg, #f5f7fa 0%, #f5f7fa 45%, #eaedf2 45.1%, #eaedf2 60%, #edf9f5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
  </style>
</head>
<body class="auth-page-bg">

  <div class="auth-wrapper">
    <!-- Top Header: Back to Home & Brand Logo -->
    <header class="auth-header-bar">
      <a href="index.html" class="auth-back-btn" id="btnBackToHome">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
      <div class="auth-brand">
        <a href="index.html" aria-label="STACKLY FinTech Home">
          <img src="Assets/Brand-logo.webp" alt="STACKLY FinTech" width="140" height="38">
        </a>
      </div>
    </header>

    <!-- Center Card -->
    <main class="auth-card-container">
      <div class="auth-card" id="loginCard">
        <div class="auth-card-head">
          <h2>Welcome Back</h2>
          <p>Sign in to your account</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <!-- Login As Dropdown -->
          <div class="form-group">
            <label class="form-label" for="loginAs">Login As</label>
            <div class="input-icon-wrap">
              <i class="fas fa-user field-icon"></i>
              <select id="loginAs" class="auth-select" required aria-label="Login As Role">
                <option value="Client" selected>Client</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <div class="input-icon-wrap">
              <i class="far fa-envelope field-icon"></i>
              <input 
                type="email" 
                id="loginEmail" 
                class="auth-input" 
                placeholder="user@example.com" 
                required 
                autocomplete="email"
              >
            </div>
            <div class="input-error-msg">Please enter a valid email address</div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label" for="loginPassword">Password</label>
              <a href="404.html" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-icon-wrap">
              <i class="fas fa-lock field-icon"></i>
              <input 
                type="password" 
                id="loginPassword" 
                class="auth-input" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="far fa-eye-slash"></i>
              </button>
            </div>
            <div class="input-error-msg">Please enter your password</div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-submit-btn" id="btnLoginSubmit">
            Login
          </button>
        </form>

        <div class="auth-footer-text">
          Don't have an account? <a href="signup.html">Create an account</a>
        </div>
      </div>
    </main>
  </div>

  <!-- GSAP Animation Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Check if redirected after registration
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      const headSub = document.querySelector('.auth-card-head p');
      if (headSub) {
        headSub.innerHTML = '<span class="text-mint font-weight-bold"><i class="fas fa-check-circle"></i> Account created! Please log in below.</span>';
      }
    }
  </script>
</body>
</html>
